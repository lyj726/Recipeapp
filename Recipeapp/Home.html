<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking App - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .home2-scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 110px; 
            padding-top: 0px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; 
        }

        .home2-scroll-area::-webkit-scrollbar {
            display: none;
        }

        .home2-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .home2-greeting {
            font-size: 22px;
            font-weight: 600;
            color: #972B17;
        }

        .home2-header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .filter-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .home2-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .search-container {
            padding: 0 24px;
            margin-bottom: 12px;
            border-radius: 24px;
        }

        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #972B17;
            height: 46px;
            border-radius: 24px;
            padding: 0 20px;
            color: #FFF;
            font-size: 15px;
            cursor: pointer;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* 冰箱食材区域 */
        .fridge-section {
            margin: 0 24px 28px 24px;
            background: #FCD7D9; 
            border-radius: 24px;
            padding: 16px;
            position: relative;
        }

        .fridge-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .fridge-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(151, 43, 23, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            color: #972B17;
            font-size: 13px;
            font-weight: 500;
        }

        .fridge-tag img {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        .add-more-btn {
            background: rgba(255, 255, 255, 0.5);
            color: #972B17;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .add-more-btn img {
            width: 14px;
            height: 14px;
        }

        /* 食材网格 */
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 8px;
        }

        .ingredient-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .ingredient-img-wrapper {
            width: 64px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ingredient-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ingredient-name {
            font-size: 13px;
            color: #1A1A1A;
            font-weight: 500;
        }

        /* 菜谱列表 */
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #1A1A1A;
            margin: 0 24px 16px 24px;
        }
        
        .recipe-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 24px;
        }

        .recipe-card {
            background: #FCE9BC; 
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .recipe-title {
            font-size: 18px;
            font-weight: 600;
            color: #972B17;
            padding-left: 2px;
        }

        .recipe-image {
            width: 98%;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            align-self: center;
        }

        .recipe-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .recipe-stats {
            display: flex;
            gap: 16px;
            margin-left: 8px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 600;
            color: #1A1A1A;
        }

        .stat-label {
            font-size: 11px;
            color: #716E65;
            margin-top: 2px;
        }
        
        .save-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            color: #716E65;
            font-size: 11px;
            margin-right: 10px;
            cursor: pointer;
        }

        .save-btn img {
            width: 20px;
            height: 18px;
        }

        .save-btn.saved {
            color: #972B17;
        }

        /* 底部导航栏 */
        .floating-bottom-nav {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 24px;
            right: 24px;
            height: 64px;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #A39F96;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            width: 60px;
            text-decoration: none;
        }

        .nav-item.active {
            color: #972B17;
        }

        .nav-icon-box {
            width: 28px;
            height: 28px;
            position: relative; 
            margin-bottom: 4px;
        }

        .nav-icon-box img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: block;
            object-fit: contain;
            filter: grayscale(100%) opacity(50%);
            transition: 0.2s;
        }

        .nav-item.active img {
            filter: grayscale(0%) opacity(100%);
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 500;
            color: #A39F96;
            line-height: 1;
        }

        .nav-item.active span {
            color: #972B17;
        }

        .nav-icon-home { width: 30px; height: 30px; }
        .nav-icon-fridge { width: 28px; height: 28px; }
        .nav-icon-fav { width: 23px; height: 23px; }
        .nav-icon-cook { width: 25px; height: 25px; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="status-bar">
            <div class="status-left">9:41</div>
            <div class="status-right">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="black">
                    <rect x="0" y="8" width="3" height="4" rx="1"/>
                    <rect x="5" y="5" width="3" height="7" rx="1"/>
                    <rect x="10" y="2" width="3" height="10" rx="1"/>
                    <rect x="15" y="0" width="3" height="12" rx="1"/>
                </svg>
                <div class="battery-icon">
                    <div class="battery-fill"></div>
                </div>
            </div>
        </div>

        <div class="home2-header">
            <div class="home2-greeting">Hi, Leila</div>
            <div class="home2-header-actions">
                <a href="index.html">
                    <img class="filter-icon" src="preference.png" alt="Preference">
                </a>
                <img class="home2-avatar" src="Persona.png" alt="Leila">
            </div>
        </div>

        <div class="search-container">
            <div class="search-bar">
                <span>Search</span>
                <img class="search-icon" src="search.png" alt="Search">
            </div>
        </div>

        <div class="home2-scroll-area">
            <div class="fridge-section">
                <div class="fridge-top">
                    <div class="fridge-tag">
                        <img src="location.png" alt="Fridge">
                        Fridge
                    </div>
                    <div class="add-more-btn">
                        Add more 
                        <img src="add.png" alt="Add">
                    </div>
                </div>
                
                <div class="ingredients-grid">
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="tomato.png" alt="Tomato"></div>
                        <div class="ingredient-name">Tomato</div>
                    </div>
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="beef.png" alt="Beef"></div>
                        <div class="ingredient-name">Beef</div>
                    </div>
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="egg.png" alt="Eggs"></div>
                        <div class="ingredient-name">Eggs</div>
                    </div>
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="carrot.png" alt="Carrot"></div>
                        <div class="ingredient-name">Carrot</div>
                    </div>
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="lettuce.png" alt="lettuce"></div>
                        <div class="ingredient-name">lettuce</div>
                    </div>
                    <div class="ingredient-item">
                        <div class="ingredient-img-wrapper"><img src="potato.png" alt="Potato"></div>
                        <div class="ingredient-name">Potato</div>
                    </div>
                </div>
            </div>

            <div class="section-title">Select a recipe!</div>
            
            <div class="recipe-list" id="homeRecipeList">
                <!-- JS 会在这里注入内容 -->
            </div>

        </div>

        <div class="floating-bottom-nav">
           <a href="Home.html" class="nav-item active">
                <div class="nav-icon-box">
                    <img class="nav-icon-home" src="home.png" alt="Home">
                </div>
                <span>Home</span>
            </a>
            
            <a href="fridge.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-fridge" src="fridge.png" alt="Fridge">
                </div>
                <span>Fridge</span>
            </a>
            
            <a href="Favorite.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-fav" src="save.png" alt="Favorite">
                </div>
                <span>Saved</span>
            </a>
            
            <a href="Cooked.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-cook" src="cooked.png" alt="Cooked">
                </div>
                <span>Cooked</span>
            </a>
        </div>

    </div>

    <script>
        const recipes = [
            {
                id: 'tomato_egg',
                title: 'Tomato & Egg Stir Fry',
                image: 'Tomato & Egg Stir Fry.png',
                time: '10 min',
                complexity: '3 steps',
                calorie: '180',
                link: 'tomato.html'
            },
            {
                id: 'beef_tomato',
                title: 'Beef & Tomato Stir Fry',
                image: 'Beef & Tomato Stir Fry.png',
                time: '25 min',
                complexity: '8 steps',
                calorie: '210',
                link: 'Beef.html'
            },
            {
                id: 'beef_potato',
                title: 'Beef & Potato Stew',
                image: 'Beef & Potato Stew.png',
                time: '50 min',
                complexity: '3 steps',
                calorie: '380',
                link: '#'
            }
        ];

        function getSavedRecipes() {
            const saved = localStorage.getItem('savedRecipes');
            return saved ? JSON.parse(saved) : [];
        }

        function sortRecipesByRules(recipeList) {
            const prefStr = localStorage.getItem('userPreferences');
            if (!prefStr) return recipeList; 

            const pref = JSON.parse(prefStr);

            let sorted = [...recipeList];

            const tomatoEggIndex = sorted.findIndex(r => r.id === 'tomato_egg');
            const beefTomatoIndex = sorted.findIndex(r => r.id === 'beef_tomato');

            if (pref.effort < 5) {
                const item = sorted.splice(tomatoEggIndex, 1)[0];
                sorted.unshift(item);
            } 

            else if (pref.budget > 5) {
                const item = sorted.splice(beefTomatoIndex, 1)[0];
                sorted.unshift(item);
            }

            else if (pref.time < 5) {
                const item = sorted.splice(tomatoEggIndex, 1)[0];
                sorted.unshift(item);
            }

            else if (pref.time > 5) {
                const item = sorted.splice(beefTomatoIndex, 1)[0];
                sorted.unshift(item);
            }

            return sorted;
        }

        function toggleSave(id, event) {
            event.stopPropagation();
            let saved = getSavedRecipes();
            const btn = event.currentTarget;

            if (saved.includes(id)) {
                saved = saved.filter(item => item !== id);
                btn.classList.remove('saved');
                btn.innerHTML = `<img src="save.png" alt="Save">Save`;
            } else {
                saved.push(id);
                btn.classList.add('saved');
                btn.innerHTML = `<img src="saved.png" onerror="this.src='save.png'" alt="Saved">Saved`;
            }
            
            localStorage.setItem('savedRecipes', JSON.stringify(saved));
        }

        function renderHomeRecipes() {
            const list = document.getElementById('homeRecipeList');
            const saved = getSavedRecipes();
            list.innerHTML = '';

            const sortedRecipes = sortRecipesByRules(recipes);

            sortedRecipes.forEach(recipe => {
                const isSaved = saved.includes(recipe.id);
                const btnClass = isSaved ? 'save-btn saved' : 'save-btn';
                const btnImg = isSaved 
                    ? `<img src="saved.png" onerror="this.src='save.png'" alt="Saved">Saved` 
                    : `<img src="save.png" alt="Save">Save`;

                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                card.onclick = function() { 
                    if(recipe.link && recipe.link !== '#') {
                        window.location.href = recipe.link; 
                    }
                };

                card.innerHTML = `
                    <div class="recipe-title">${recipe.title}</div>
                    <img class="recipe-image" src="${recipe.image}" alt="${recipe.title}">
                    <div class="recipe-info-row">
                        <div class="recipe-stats">
                            <div class="stat-item">
                                <span class="stat-value">${recipe.time}</span>
                                <span class="stat-label">Time need</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">${recipe.complexity}</span>
                                <span class="stat-label">Complexity</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">${recipe.calorie}</span>
                                <span class="stat-label">Calorie (kcal)</span>
                            </div>
                        </div>
                        <div class="${btnClass}" onclick="toggleSave('${recipe.id}', event)">
                            ${btnImg}
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        renderHomeRecipes();
    </script>
</body>
</html>
