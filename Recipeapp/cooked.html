<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking App - Cooked</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
        .cooked-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .cooked-title {
            font-size: 24px;
            font-weight: 600;
            color: #972B17;
        }
        .cooked-header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .filter-icon { width: 24px; height: 24px; object-fit: contain; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

        .calendar-card {
            margin: 0 24px;
            background: #D8CCEC;
            border-radius: 24px;
            padding: 24px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 110px;
        }

        .calendar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 8px;
        }
        .month-title {
            font-size: 22px;
            font-weight: 700;
            color: #5B4380;
        }
        .arrow-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 16px;
            column-gap: 4px;
            text-align: center;
        }

        .weekday {
            font-size: 12px;
            font-weight: 600;
            color: #5B4380;
            margin-bottom: 8px;
        }

        .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 56px;
            position: relative;
        }

        .day-number {
            font-size: 13px;
            font-weight: 500;
            color: #1A1A1A;
            margin-bottom: 2px;
        }

        .day-cell.has-record {
            background: rgba(255, 255, 255, 0.4);
            border: 1px dashed #8C73B3;
            border-radius: 10px;
            padding-top: 4px;
            height: 60px;
            width: 100%;
        }

        .day-cell.selected {
            border: 2px dashed #5B4380;
            background: rgba(255, 255, 255, 0.6);
        }

        .food-icon {
            font-size: 20px;
            line-height: 1;
            margin-top: 2px;
        }

        .floating-bottom-nav {
            position: absolute; 
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 24px; 
            right: 24px; 
            height: 64px;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100;
        }
        .nav-item {
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 4px; 
            color: #A39F96; 
            font-size: 10px; 
            font-weight: 500;
            cursor: pointer; 
            width: 60px; 
            text-decoration: none;
        }
        .nav-item.active { color: #972B17; }
        
        .nav-icon-box {
            width: 28px; 
            height: 28px; 
            position: relative; 
            margin-bottom: 4px;
        }
        .nav-icon-box img {
            position: absolute; 
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            display: block; 
            object-fit: contain;
            filter: grayscale(100%) opacity(50%);
            transition: 0.2s;
        }
        .nav-item.active img { filter: grayscale(0%) opacity(100%); }
        
        .nav-icon-svg {
            width: 24px; height: 24px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .nav-item span {
            font-size: 10px; 
            font-weight: 500; 
            color: #A39F96; 
            line-height: 1;
        }
        .nav-item.active span { color: #972B17; }

        .nav-icon-home { width: 30px; height: 30px; }
        .nav-icon-fridge { width: 28px; height: 28px; }
        .nav-icon-fav { width: 23px; height: 23px; }
        .nav-icon-cook { width: 25px; height: 25px; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- 状态栏 -->

            <div class="status-left">9:41</div>
            <div class="status-right">

        <div class="cooked-header">

        </div>

                <div class="month-title">October</div>

                <div class="day-cell has-record">

                </div>
                <div class="day-cell has-record">
                    <span class="day-number">6</span>

                </div>
                <div class="day-cell has-record">
                    <span class="day-number">7</span>
                    <div class="food-icon">🍛</div>
                </div>
                <div class="day-cell has-record">
                    <span class="day-number">8</span>
                    <div class="food-icon">🍲</div>
                </div>
                <div class="day-cell has-record">
                    <span class="day-number">9</span>

                <div class="day-cell has-record">

                <div class="day-cell"><span class="day-number">16</span></div>
                <div class="day-cell"><span class="day-number">17</span></div>
                <div class="day-cell"><span class="day-number">18</span></div>

                <div class="day-cell"><span class="day-number">19</span></div>

                <div class="day-cell"><span class="day-number">23</span></div>
                <div class="day-cell"><span class="day-number">24</span></div>
                <div class="day-cell"><span class="day-number">25</span></div>

                <div class="day-cell"><span class="day-number">26</span></div>
                <div class="day-cell"><span class="day-number">27</span></div>
                <div class="day-cell"><span class="day-number">28</span></div>

                <div class="day-cell"><span class="day-number">30</span></div>
                <div class="day-cell"><span class="day-number">31</span></div>
            </div>
        </div>

        <div class="floating-bottom-nav">
            <a href="Home.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-home" src="home.png" alt="Home">
                </div>
                <span>Home</span>
            </a>
            
            <a href="fridge.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-fridge" src="fridge.png" alt="Fridge">
                </div>
                <span>Fridge</span>
            </a>
            
            <a href="Favorite.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-fav" src="save.png" alt="Saved">

            <a href="Cooked.html" class="nav-item">
                <div class="nav-icon-box">
                    <img class="nav-icon-cook" src="cooked.png" alt="Cooked">

                <span>Cooked</span>

        </div>

    </div>
</body>
</html>
