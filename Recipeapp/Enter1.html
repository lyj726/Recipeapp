<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Preference App - Step 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <div class="status-left">9:41</div>
            <div class="status-right">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="black"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <div class="battery-icon"><div class="battery-fill"></div></div>
            </div>
        </div>

        <div id="page-step1" class="page-view active">
            <div class="header-area">
                <img class="top-avatar" src="Persona.png" alt="Avatar">
                <div class="progress-bar">
                    <div class="progress-segment active"></div>
                    <div class="progress-segment inactive"></div>
                    <div class="progress-segment inactive"></div>
                    <div class="progress-segment inactive"></div>
                    <div class="progress-segment inactive"></div>
                </div>
                <div class="main-title">What's your cooking preference today?</div>
                <div class="sub-title">How much do you want a taste of home?</div>
            </div>

            <div class="radar-area">
                <div class="axis-label label-familiarity" style="opacity: 1;">Familiarity</div>
                <div class="axis-label label-effort dimmed">Cooking<br>Effort</div>
                <div class="axis-label label-budget dimmed">Budget Priority</div>
                <div class="axis-label label-time dimmed">Time<br>Available</div>
                
                <div class="radar-wrapper">
                    <svg class="radar-svg" viewBox="0 0 344 344">
                        <g stroke="#E0DDD6" stroke-width="1" fill="none" opacity="0.6">
                            <circle cx="172" cy="172" r="15" /><circle cx="172" cy="172" r="30" />
                            <circle cx="172" cy="172" r="45" /><circle cx="172" cy="172" r="60" />
                            <circle cx="172" cy="172" r="75" /><circle cx="172" cy="172" r="90" />
                            <circle cx="172" cy="172" r="105" /><circle cx="172" cy="172" r="120" />
                            <circle cx="172" cy="172" r="135" /><circle cx="172" cy="172" r="150" />
                        </g>
                        <g stroke="#E0DDD6" stroke-width="1" opacity="0.6">
                            <line x1="172" y1="12" x2="172" y2="332" />
                            <line x1="12" y1="172" x2="332" y2="172" />
                        </g>
                        <g id="sectorsGroup">
                            <!-- 只有 Familiarity 的色块 -->
                            <path id="sector-familiarity" fill="#FACC5A" fill-opacity="0.6" stroke="#FACC5A" stroke-width="2" />
                        </g>
                        <circle cx="172" cy="172" r="4" fill="#972B17" />
                    </svg>
                </div>
            </div>

            <div class="bottom-area">
                <div class="single-card">
                    <div class="card-label">Familiarity</div>
                    <div class="control-row">
                        <div class="btn-circle" onclick="updateValue('familiarity', -1)">-</div>
                        <div class="value-display val-familiarity" id="val-familiarity">7</div>
                        <div class="btn-circle" onclick="updateValue('familiarity', 1)">+</div>
                    </div>
                </div>
                <div class="action-buttons row">
                    <div class="btn-secondary" onclick="window.location.href='Enter.html'">Previous Step</div>
                    <div class="btn-enter" onclick="saveAndNext('Enter2.html')">Next</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const savedPref = localStorage.getItem('userPreferences');
        const data = savedPref ? JSON.parse(savedPref) : { familiarity: 7, effort: 3, budget: 9, time: 5 };

        const MAX_RADIUS = 150;
        const CENTER = 172;

        function polarToCartesian(cx, cy, r, angleDeg) {
            const rad = (angleDeg - 90) * Math.PI / 180.0;
            return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y, "L", x, y, "Z"].join(" ");
        }

        function updateChart() {
            const val = data.familiarity;
            const radius = (val / 10) * MAX_RADIUS;
            const pathData = describeArc(CENTER, CENTER, radius, -45, 45);
            document.getElementById('sector-familiarity').setAttribute('d', pathData);
            document.getElementById('val-familiarity').innerText = val;
        }

        function updateValue(key, delta) {
            let newValue = data[key] + delta;
            if (newValue < 1) newValue = 1;
            if (newValue > 10) newValue = 10;
            data[key] = newValue;
            updateChart();
        }

        function saveAndNext(url) {
            localStorage.setItem('userPreferences', JSON.stringify(data));
            window.location.href = url;
        }

        window.onload = updateChart;
    </script>
</body>
</html>
